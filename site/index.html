<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Official髭男dism 演出場次與曲目清單檔案庫：收錄 2012 年至今完整現場足跡，提供場次查歌單與歌曲查場次雙向檢索。"
    />
    <title>Official髭男dism Setlist 檔案庫｜場次與曲目演出紀錄</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="m-0 bg-paper font-body leading-[1.6] text-ink [-webkit-text-size-adjust:100%] [color-scheme:light] selection:bg-tape selection:text-paper">
    <!-- 檯燈柔和聚光微光 (Desk Lamp Ambient Spotlight) -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(ellipse_85%_700px_at_50%_0%,var(--color-ambient-glow)_0%,transparent_100%)]"></div>
    <!-- 日系 5mm 方眼手帳格線 (Japanese 5mm Graph Notebook Grid) -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 notebook-grid"></div>
    <!-- 日系典藏手感紙質微粒 (Tactile Archival Paper Grain) -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 paper-grain opacity-[0.035] mix-blend-multiply dark:mix-blend-screen dark:opacity-[0.05]"></div>
    <div id="app" class="relative z-10 pb-[72px] min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
